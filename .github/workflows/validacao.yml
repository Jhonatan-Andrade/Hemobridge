name: Validação do HemoBridge
on:
  pull_request:
  push:
    branches: [main, 'review/**', 'refactor/**']
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint && npm run check:naming && npm test && npm run build
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://validation:validation-local-only@127.0.0.1:55439/hemobridge_test
      JWT_SECRET: segredo-exclusivo-do-ambiente-descartavel-de-integracao
      ARMAZENAMENTO_CHAVE: dmFsaWRhdGlvbi1vbmx5LWtleS0zMi1ieXRlcyEhISE=
      S3_ENDPOINT: http://127.0.0.1:58333
      S3_REGIAO: us-east-1
      S3_BUCKET: validation-exams
      S3_ACCESS_KEY: validation
      S3_SECRET_KEY: validation-local-only
      S3_FORCE_PATH_STYLE: 'true'
      SMTP_HOST: 127.0.0.1
      SMTP_PORTA: '1025'
      SMTP_SEGURO: 'false'
      EMAIL_REMETENTE: HemoBridge <validacao@example.invalid>
      MAILPIT_URL: http://127.0.0.1:8025
      FRONTEND_URL: http://localhost:5174
      CORS_ORIGENS: http://localhost:5174
      NOTIFICACOES_REENVIO_MINUTOS: '0'
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation-local-only
          POSTGRES_DB: hemobridge_test
        ports: ['55439:5432']
        options: >-
          --health-cmd "pg_isready -U validation -d hemobridge_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mail:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Iniciar armazenamento descartável
        run: |
          docker run -d --name arquivos-teste -p 127.0.0.1:58333:8333 --tmpfs /data chrislusf/seaweedfs:4.47 server -dir=/data -ip=localhost -ip.bind=0.0.0.0 -s3 -s3.port=8333 -master.volumeSizeLimitMB=64 -volume.max=50
          for tentativa in $(seq 1 30); do
            if curl --silent --output /dev/null http://127.0.0.1:58333; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm ci
      - run: npm run db:setup
      - run: npm run lint && npm run build && npm test && npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
  aplicativo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze && flutter test
      - name: Compilar APK de teste Android
        run: flutter build apk --debug --target-platform android-arm64,android-x64 --dart-define=API_URL=http://127.0.0.1:3000
      - name: Disponibilizar APK para homologação
        uses: actions/upload-artifact@v4
        with:
          name: hemobridge-android-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
