services:
  db:
    image: postgis/postgis:17-3.5
    container_name: hemobridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hemobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-hemobridge}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - hemobridge-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init/20-remove-extensoes-extras.sql:/docker-entrypoint-initdb.d/20-remove-extensoes-extras.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Captura os e-mails enviados em desenvolvimento: http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    container_name: hemobridge-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  hemobridge-pgdata:
