services:
  db:
    image: postgis/postgis:17-3.5
    container_name: hemobridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hemobridge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: ${POSTGRES_DB:-hemobridge}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - hemobridge-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init/20-remove-extensoes-extras.sql:/docker-entrypoint-initdb.d/20-remove-extensoes-extras.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # Armazenamento S3 dos arquivos de exame: http://localhost:8333 (HEM-17)
  s3:
    image: chrislusf/seaweedfs:4.47
    container_name: hemobridge-s3
    restart: unless-stopped
    command: server -dir=/data -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -master.volumeSizeLimitMB=1024
    ports:
      - '${S3_PORTA:-8333}:8333'
    volumes:
      - hemobridge-s3data:/data
      - ./docker/seaweedfs/s3.dev.json:/etc/seaweedfs/s3.json:ro

  # Captura os e-mails enviados em desenvolvimento: http://localhost:8025
  mail:
    image: axllent/mailpit:latest
    container_name: hemobridge-mailpit
    restart: unless-stopped
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
  hemobridge-pgdata:
  hemobridge-s3data:
